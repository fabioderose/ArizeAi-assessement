[tool.poetry]
name = "se-interview"
version = "0.2.0"
description = "Travel assistant LangGraph agent instrumented and evaluated with Arize Phoenix"
authors = ["Fabio De Rose <fabioderose@me.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
langgraph = "^1.0"
langchain = "^1.0"
langchain-community = "^0.4"
langchain-openai = "^1.0"
ddgs = "^9.0"
python-dotenv = "^1.0"
fastapi = ">=0.137"
uvicorn = ">=0.32"
httpx = "^0.28"
pandas = "^2.2"
arize-phoenix = "^20.0"
arize-phoenix-otel = "^0.17"
arize-phoenix-client = "^3.0"
arize-phoenix-evals = "^3.0"
openinference-instrumentation-langchain = "^0.1.60"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
